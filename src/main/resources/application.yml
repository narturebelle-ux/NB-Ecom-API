# Shown by GET /health and /. Vercel sets this to the commit it deployed.
app:
  version: ${VERCEL_GIT_COMMIT_SHA:unknown}

spring:
  application:
    name: narturebelle-backend
  profiles:
    active: default

  # Common Database Configuration — Supabase PostgreSQL (session pooler) for all non-test profiles.
  # No defaults on purpose: never hard-code credentials, fail fast if env vars are missing.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      # Vercel can start several copies at once. Open connections as needed, so they do not fill the database's limit.
      minimum-idle: 1

  # Common JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # Flyway owns the schema from here on. baseline-on-migrate=true because real tables already
  # exist in every non-test DB (created earlier by ddl-auto: update) — this adopts the current
  # schema as "V1 already applied" instead of trying to re-run CREATE TABLE against it.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  # Careers résumé uploads (CareersService re-checks the 4 MB cap and the file type).
  # Kept under Vercel's 4.5 MB request-body limit, so an oversized file gets our 413, not Vercel's.
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4400KB

# Server Port
server:
  # The Docker image sets PORT=80, the port Vercel's Container runtime routes to by default.
  port: ${PORT:8085}
  # Behind a proxy: take the client IP from X-Forwarded-For (only trusted from internal proxy
  # addresses). On Vercel, RateLimiter.clientIp reads X-Real-IP instead.
  forward-headers-strategy: native
  tomcat:
    # Read past an oversized upload so the browser gets the 413 RESUME_TOO_LARGE body, not a reset.
    max-swallow-size: 10MB

# CORS — set here once for every environment/profile (no per-profile override).
cors:
  allowed-origins: "https://narturebelle.com,https://www.narturebelle.com,https://stage-narturebelle.com,https://staging.narturebelle.com,http://localhost:*"

# Firebase Credentials — tried in order: base64 env var, then local file, then ADC.
firebase:
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  credentials:
    path: classpath:firebase-service-account.json

# Feature flags live in the feature_flags DB table now (see V4__feature_flags.sql and
# AdminFeatureFlagController) — not here. GET /api/v1/features reads the table directly.

# Mock payment provider (Phase 2). Signs/verifies webhook payloads via HMAC-SHA256. The default is
# fine for local/test — only matters once a real secret needs to be kept out of source control, and
# MockPaymentProvider never ships past the prototype anyway (Phase 7 replaces it with a real gateway).
payments:
  mock:
    webhook-secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:dev-only-mock-webhook-secret-change-me}

# Where things live (owner, D48, 11 Nov 2026): Supabase is the DATABASE only (the datasource above).
# Every file and video — images, PDFs, documents, videos — is stored in AWS S3 (below).
#
# Legacy Supabase Storage: only for any old record whose file was stored there before S3 (none exist
# as of 11 Nov 2026). Optional: leave SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY unset; if an old
# Supabase file is ever opened without them, that one call fails with a clear message.
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:health-records}

# AWS S3 file storage (F9-S19, D48; setup in S3_SETUP.md). S3 is the default for all new uploads, and
# S3_BUCKET is required: the API refuses to start without it (no silent fallback to anything else).
# STORAGE_PROVIDER=supabase exists only for old setups and tests. Each record remembers its own storage.
# Access keys: only on the API Vercel projects, never in git, chat or the UI project. NB_S3_* because
# Vercel reserves the AWS_* names; leave both empty to use the AWS default chain (for example a role).
storage:
  provider: ${STORAGE_PROVIDER:s3}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-south-1}
    access-key-id: ${NB_S3_ACCESS_KEY_ID:}
    secret-access-key: ${NB_S3_SECRET_ACCESS_KEY:}

# Records vault upload/sharing policy knobs — placeholder defaults, flagged in HANDOFF.md.
records:
  upload:
    # Documents and images (DOCUMENT kind): 25 MB by default.
    allowed-mime-types: ${RECORDS_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png,image/heic}
    max-size-bytes: ${RECORDS_MAX_SIZE_BYTES:26214400}
    # Always refused, even if added to the allowed list: Word files until the owner decides (D49).
    blocked-mime-types: ${RECORDS_BLOCKED_MIME_TYPES:application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
    # About 10 GB per mother in total (D49). Deleted files and videos past their removal date don't count.
    quota-bytes-per-user: ${RECORDS_QUOTA_BYTES_PER_USER:10737418240}
  video:
    # Videos are accepted only when STORAGE_PROVIDER=s3. Maximum size is an open question (D49): 2 GB default.
    allowed-mime-types: ${RECORDS_VIDEO_MIME_TYPES:video/mp4,video/quicktime,video/webm,video/3gpp}
    max-size-bytes: ${RECORDS_VIDEO_MAX_SIZE_BYTES:2147483648}
    # Larger videos upload in parts (S3 multipart); each part 16 MB by default (S3 minimum is 5 MB).
    multipart-threshold-bytes: ${RECORDS_VIDEO_MULTIPART_THRESHOLD_BYTES:67108864}
    part-size-bytes: ${RECORDS_VIDEO_PART_SIZE_BYTES:16777216}
    # MUST match the S3 lifecycle rule on videos/ (S3_SETUP.md). Counted from upload until D49 says otherwise.
    # trash-days is for videos only (7). Deleted documents stay 30 days in trash (owner, 11 Nov 2026), which the
    # bucket's files-deleted-versions-30-days rule alone handles: the app has no document timer, and no timer
    # ever deletes a document she hasn't deleted herself (D49: documents kept at least 1 year).
    retention-days: ${RECORDS_VIDEO_RETENTION_DAYS:30}
    trash-days: ${RECORDS_VIDEO_TRASH_DAYS:7}
    # Warnings before removal: day 23 and day 29 of 30. The UI shows the banner from the first one.
    warn-days-before: ${RECORDS_VIDEO_WARN_DAYS_BEFORE:7,1}
    # Daily video job (warnings, TRASHED/PURGED audit): 09:00 India time, only with SCHEDULING_ENABLED on.
    job-cron: ${RECORDS_VIDEO_JOB_CRON:0 0 9 * * *}
    # Where the warning email's "Download it now" link goes (the app, never S3). Pre-production sets its own.
    app-records-url: ${APP_RECORDS_URL:https://narturebelle.com/records}
    # In-app warnings need Notifications to accept reminder type VIDEO_REMOVAL_WARNING first (TASKS.md F9-S19 item 12).
    in-app-warnings-enabled: ${RECORDS_VIDEO_IN_APP_WARNINGS:false}
  scan:
    # S3 uploads open only after GuardDuty tags them clean. false = pre-production testing without GuardDuty
    # only (owner, 11 Nov 2026): new S3 uploads are NOT_SCANNED and open at once. The prod profile refuses to start with false.
    required: ${RECORDS_SCAN_REQUIRED:true}
  share:
    max-expiry-days: ${RECORDS_SHARE_MAX_EXPIRY_DAYS:180}

# NB-Ecom-Notifications-API sends all email and owns reminders and notification preferences.
mails:
  base-url: ${MAILS_API_URL:http://localhost:8082}

# Keys the reminder dedupe hash. Stays in this API: never share it with NB-Ecom-Notifications-API.
reminders:
  dedupe-secret: ${REMINDER_DEDUPE_SECRET:dev-only-reminder-dedupe-secret}

# The private token shared with the other NartureBelle services. Empty means every /internal call is refused.
internal:
  api-token: ${INTERNAL_API_TOKEN:}

careers:
  # Careers applications and ideas/feedback go to the hello@ mailbox (product-owner decision, 2026-10-30).
  admin-email: ${CAREERS_ADMIN_EMAIL:hello@narturebelle.com}
  # Where the team downloads a résumé after signing in. Application emails link here instead of attaching the file.
  admin-url: ${CAREERS_ADMIN_URL:https://narturebelle.com/admin/careers}
  resume:
    # Résumés uploaded straight to S3 (PDF, DOC, DOCX): 10 MB by default. The older form upload stays at 4 MB.
    max-size-bytes: ${CAREERS_RESUME_MAX_SIZE_BYTES:10485760}

# Care professional documents uploaded straight to S3 (owner, 12 Nov 2026). PDF, JPG and PNG, 20 MB by default;
# the older upload through the API stays at 4 MB. All go under files/ in S3 (no expiry, GuardDuty scan).
provider-onboarding:
  upload:
    max-size-bytes: ${PROVIDER_DOCUMENT_MAX_SIZE_BYTES:20971520}
    # Question keys that also take a video. Empty: no current question suits one. How long provider videos are
    # kept is an open owner decision, so leave this empty until it is made.
    video-question-keys: ${PROVIDER_VIDEO_QUESTION_KEYS:}
    video-max-size-bytes: ${PROVIDER_VIDEO_MAX_SIZE_BYTES:524288000}

# Idea pool: paid members' votes an idea needs before it is considered for implementation.
ideas:
  vote-goal: ${IDEAS_VOTE_GOAL:1000}

# Encrypts care professionals' PAN and bank account numbers (AES-256-GCM). Base64 of 32 random bytes.
# Optional for now: without it the app starts, but FieldEncryptor refuses those fields with a 503.
data:
  encryption-key: ${DATA_ENCRYPTION_KEY:}

onboarding:
  # Firebase must report a verified email AND a verified phone before an application can be submitted.
  require-phone-verification: ${REQUIRE_PHONE_VERIFICATION:true}
  # Off in prod until the real fixed fees, agreement and training text are in place (see application-prod.yml)
  agreement-signing-enabled: ${AGREEMENT_SIGNING_ENABLED:true}
  # The approved time periods.
  reapply-after-months: 6
  draft-first-reminder-days: 3
  draft-second-reminder-days: 14
  draft-delete-days: 90
  changes-close-days: 30
  recheck-after-days: 60
  licence-reminder-days: 60,30,7
  retention-months: 12

narturebelle:
  scheduling:
    # Off in the test profile (see application-test.yml) -- a @Scheduled job firing mid-test would
    # mutate data a test didn't create. Real default is on.
    enabled: ${SCHEDULING_ENABLED:true}

# Logging Configuration
logging:
  level:
    root: INFO
    com.narturebelle: INFO
