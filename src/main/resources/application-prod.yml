# =========================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# =========================================================================
# Datasource (DB_URL/DB_USERNAME/DB_PASSWORD) is inherited from application.yml —
# points at the Supabase session pooler via env vars, no defaults.
# CORS (cors.allowed-origins) is also inherited from application.yml — same for every environment.

spring:
  jpa:
    hibernate:
      ddl-auto: validate # Never auto-create/update schema in production — Flyway owns it
    show-sql: false

logging:
  level:
    root: WARN
    com.narturebelle: INFO

# Stays off until the real fixed fees, agreement and training text are in place: otherwise real
# professionals could sign the DRAFT agreement and placeholder fee.
onboarding:
  agreement-signing-enabled: ${AGREEMENT_SIGNING_ENABLED:false}
