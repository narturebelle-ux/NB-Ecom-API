# =========================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# =========================================================================
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:3306/narturebelle?useSSL=true&serverTimezone=UTC}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate # Never auto-drop in production
    show-sql: false

features:
  nurse-companion: ${FEATURE_NURSE_COMPANION:true}
  hospital-leads: ${FEATURE_HOSPITAL_LEADS:true}
  doctor-live-sessions: ${FEATURE_DOCTOR_LIVE:true}
  assessment-voucher: ${FEATURE_ASSESSMENT_VOUCHER:true}
  baby-care-products: ${FEATURE_BABY_CARE:false}

logging:
  level:
    root: WARN
    com.narturebelle: INFO
