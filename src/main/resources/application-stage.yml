# =========================================================================
# STAGING ENVIRONMENT CONFIGURATION
# =========================================================================
# Datasource (DB_URL/DB_USERNAME/DB_PASSWORD) is inherited from application.yml —
# points at the Supabase session pooler via env vars, no defaults.
# CORS (cors.allowed-origins) is also inherited from application.yml — same for every environment.

spring:
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns schema changes now — see application.yml
    show-sql: false

logging:
  level:
    com.narturebelle: DEBUG

# No defaults: a missing value must stop startup, not quietly queue mail until the rows fail a day later.
mails:
  base-url: ${MAILS_API_URL}

internal:
  api-token: ${INTERNAL_API_TOKEN}

reminders:
  dedupe-secret: ${REMINDER_DEDUPE_SECRET}

# Otherwise application emails would link to the production admin screen.
careers:
  admin-url: ${CAREERS_ADMIN_URL}
