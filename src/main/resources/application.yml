spring:
  application:
    name: narturebelle-backend
  profiles:
    active: default

  # Common Database Configuration — Supabase PostgreSQL (session pooler) for all non-test profiles.
  # No defaults on purpose: never hard-code credentials, fail fast if env vars are missing.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  # Common JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # Flyway owns the schema from here on. baseline-on-migrate=true because real tables already
  # exist in every non-test DB (created earlier by ddl-auto: update) — this adopts the current
  # schema as "V1 already applied" instead of trying to re-run CREATE TABLE against it.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  # Careers résumé uploads (CareersService re-checks the 4 MB cap and the file type).
  # Kept under Vercel's 4.5 MB request-body limit, so an oversized file gets our 413, not Vercel's.
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4400KB

# Server Port
server:
  # The Docker image sets PORT=80, the port Vercel's Container runtime routes to by default.
  port: ${PORT:8085}
  # Behind a proxy: take the client IP from X-Forwarded-For (only trusted from internal proxy
  # addresses). On Vercel, RateLimiter.clientIp reads X-Real-IP instead.
  forward-headers-strategy: native
  tomcat:
    # Read past an oversized upload so the browser gets the 413 RESUME_TOO_LARGE body, not a reset.
    max-swallow-size: 10MB

# CORS — set here once for every environment/profile (no per-profile override).
cors:
  allowed-origins: "https://narturebelle.com,https://www.narturebelle.com,https://stage-narturebelle.com,http://localhost:*"

# Firebase Credentials — tried in order: base64 env var, then local file, then ADC.
firebase:
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  credentials:
    path: classpath:firebase-service-account.json

# Feature flags live in the feature_flags DB table now (see V4__feature_flags.sql and
# AdminFeatureFlagController) — not here. GET /api/v1/features reads the table directly.

# Mock payment provider (Phase 2). Signs/verifies webhook payloads via HMAC-SHA256. The default is
# fine for local/test — only matters once a real secret needs to be kept out of source control, and
# MockPaymentProvider never ships past the prototype anyway (Phase 7 replaces it with a real gateway).
payments:
  mock:
    webhook-secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:dev-only-mock-webhook-secret-change-me}

# Supabase Storage (Phase 4) — reuses the same Supabase project as the Postgres DB (same us-east-1
# region, no new infra account). No defaults on these two: there's no safe degraded mode for
# storage, unlike Firebase's ADC fallback chain, so fail fast exactly like DB_URL/DB_PASSWORD.
supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:health-records}

# Records vault upload/sharing policy knobs — placeholder defaults, flagged in HANDOFF.md.
records:
  upload:
    allowed-mime-types: ${RECORDS_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png,image/heic}
    max-size-bytes: ${RECORDS_MAX_SIZE_BYTES:26214400}
  share:
    max-expiry-days: ${RECORDS_SHARE_MAX_EXPIRY_DAYS:180}

# Email (careers applications, feedback). Without RESEND_API_KEY, LoggingEmailSender only logs and
# nothing is delivered; submissions are still saved and visible to admins.
email:
  from: ${EMAIL_FROM:NartureBelle <no-reply@narturebelle.com>}
  resend:
    api-key: ${RESEND_API_KEY:}

careers:
  # Careers applications and ideas/feedback go to the hello@ mailbox (product-owner decision, 2026-10-30).
  admin-email: ${CAREERS_ADMIN_EMAIL:hello@narturebelle.com}

narturebelle:
  scheduling:
    # Off in the test profile (see application-test.yml) -- a @Scheduled job firing mid-test would
    # mutate data a test didn't create. Real default is on.
    enabled: ${SCHEDULING_ENABLED:true}

# Logging Configuration
logging:
  level:
    root: INFO
    com.narturebelle: INFO
