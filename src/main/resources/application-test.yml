# =========================================================================
# TEST ENVIRONMENT CONFIGURATION
# =========================================================================
# Fully overrides the Supabase datasource from application.yml with in-memory H2,
# so tests never need real DB_URL/DB_USERNAME/DB_PASSWORD env vars.
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:narturebelle_testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS provider_onboarding
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.hbm2ddl.create_namespaces: true
  # Flyway targets Postgres-specific SQL; tests stay on H2 create-drop instead (see HANDOFF.md).
  # If H2/Postgres schema drift becomes a real problem, switch to Testcontainers Postgres.
  flyway:
    enabled: false

# Dummy values so the real SupabaseStorageProvider bean constructs harmlessly in every test
# context, including ones that don't @MockBean StorageProvider — its RestClient is never actually
# invoked unless a test calls it, same reasoning as the H2 override above for the datasource.
supabase:
  url: http://localhost:9999
  service-role-key: test-service-role-key

data:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

narturebelle:
  scheduling:
    enabled: false

features:
  nurse-companion: true
  hospital-leads: true
  doctor-live-sessions: true
  assessment-voucher: true
  baby-care-products: false

logging:
  level:
    com.narturebelle: DEBUG

# Email rows send inline, so tests can assert on them without waiting for the background pool.
mails:
  async-dispatch: false

internal:
  api-token: test-internal-token
